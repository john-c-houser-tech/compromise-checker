# CI: lint and tests for the controller, and the collector's tests run with
# the targets' own python3 inside the target distributions' container images.
# No network beyond package installs, no secrets, nothing spent.
#
# A change that touches only Markdown files, issue forms or the Sponsor
# button's file skips the jobs that test code. The check for invisible
# characters runs on every change all the same, since prose is where they
# have slipped in.
# The ruleset on main requires the one "CI result" check, which passes when
# every job before it passed or was skipped, so a skip never blocks a merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Anything besides Markdown, issue forms and the Sponsor button?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # When in doubt (no diff, an empty diff), run everything.
          if ! files=$(git diff --name-only --no-renames "$BASE...$HEAD"); then
            echo "Couldn't diff $BASE...$HEAD, so everything runs"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          prose='\.md$|^\.github/ISSUE_TEMPLATE/|^\.github/FUNDING\.yml$'
          tested='^docs/report-json\.md$'  # a test holds this page to what the code writes
          if [ -z "$files" ] || grep -qvE "$prose" <<< "$files" || grep -qE "$tested" <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown, issue forms or FUNDING.yml changed, so the code jobs are skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # tests/test_repo_text.py, run without pytest: it needs only the
      # standard library, and this job runs even when the test jobs don't.
      - name: No invisible characters, whatever changed
        run: |
          python3 - <<'PY'
          import runpy
          tests = runpy.run_path("tests/test_repo_text.py")
          tests["test_no_invisible_characters_in_the_repository"]()
          PY

  controller:
    name: Controller (Python ${{ matrix.python }}${{ matrix.store == 'postgres' && ', store on PostgreSQL' || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, and what the dev machine runs; then the whole suite once
        # more with every store on PostgreSQL, beside the others, not after.
        include:
          - {python: "3.12", store: sqlite}
          - {python: "3.15", store: sqlite}
          - {python: "3.12", store: postgres}
    services:
      postgres:  # a throwaway, for the store's promises on both databases
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 > /dev/null  # WeasyPrint's
      - run: pip install -e ".[dev]"
      - name: Lint
        if: matrix.store == 'sqlite'
        run: |
          ruff check .
          ruff format --check .
      # -n auto: one worker for each of the runner's cores. Every test has a
      # folder, a port and, on PostgreSQL, a schema of its own.
      - name: Tests
        if: matrix.store == 'sqlite'
        run: pytest -q -n auto
        env:
          CHECKER_TEST_CRASH: "1"
          PGPASSWORD: test
          CHECKER_TEST_POSTGRES: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Tests, with the store on PostgreSQL
        if: matrix.store == 'postgres'
        run: pytest -q -n auto
        env:
          PGPASSWORD: test
          CHECKER_TEST_POSTGRES_EVERYWHERE: postgresql://postgres@127.0.0.1:5432/postgres
      - name: The package holds the key list
        if: matrix.store == 'sqlite'
        run: |
          pip wheel --no-deps -q -w /tmp/wheel .
          python -m zipfile -l /tmp/wheel/*.whl > /tmp/wheel/files
          grep -q 'checker/packs/keys/keys\.yaml ' /tmp/wheel/files
          grep -q 'checker/packs/keys/keys\.yaml\.minisig ' /tmp/wheel/files

  release:
    name: Release build (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # the range a first release supports: 3.15 has no wheel for PyYAML yet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 curl > /dev/null  # WeasyPrint's
      - run: pip install --quiet pydantic cryptography uv==0.12.10  # the build script's checks, and the list's maker
      - name: The list still meets pyproject.toml
        run: python scripts/release.py lock --check
      - name: Build the same commit twice, compare, and compare with the commit
        run: python scripts/release.py build --prerelease --trial
      - name: Install from the release alone, as a machine would
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/pip install --quiet --require-hashes --only-binary :all: -r dist/trial-*/requirements.lock
          /tmp/installed/bin/pip install --quiet --no-deps --no-index dist/trial-*/*.whl
          /tmp/installed/bin/pip check
      - name: The installed tool serves its pages, away from the repository
        working-directory: /tmp
        env:
          CHECKER_HOME: /tmp/checker-home
        run: |
          /tmp/installed/bin/checker --version
          /tmp/installed/bin/python -c "import django, django_otp, gunicorn, psycopg, weasyprint, anthropic"
          trap 'cat /tmp/web.log' ERR
          /tmp/installed/bin/checker web > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://127.0.0.1:8088/login && break
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:8088/login | grep --quiet 'name="password"'
          curl --silent --show-error --fail --output /dev/null http://127.0.0.1:8088/style.css
          grep --quiet '/s/' /tmp/web.log

  collector:
    name: Collector on ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - rockylinux/rockylinux:9   # python3 3.9 — the floor
          - rockylinux/rockylinux:10
          - ubuntu:22.04              # python3 3.10
          - ubuntu:24.04
          - ubuntu:26.04              # python3 3.14
    steps:
      - name: Install python3 (Ubuntu images ship without it)
        if: startsWith(matrix.image, 'ubuntu')
        run: apt-get update -qq && apt-get install -y -qq python3 > /dev/null
      - uses: actions/checkout@v7
      - name: Collector tests with the system python3
        run: |
          python3 --version
          python3 -m unittest discover -s tests/collector -v

  # The one check main's ruleset requires.
  result:
    name: CI result
    if: always()
    needs: [changes, controller, release, collector]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
