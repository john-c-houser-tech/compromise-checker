# Compromise Checker's base profile: what clean servers on the supported
# images show that isn't a sign of anything (DESIGN.md §11; plan 2.10).
# Apply it with `profiles: [base]` in a whitelist file. Every rule here
# names what it covers narrowly; none hides a whole check.
rules:
  - id: base-firewalld-libffi
    match: {check: process.injected, variant: libffi, exe: "/usr/bin/python3*", program: firewalld}
    reason: >-
      firewalld (RHEL, Rocky, Alma) runs on Python, whose ctypes has libffi
      make its closures in memory-only files. Only the libffi kind, only
      firewalld on the system's Python: another Python process with such a
      file stays a (low) finding, and code from a deleted or scratch file
      always does.
    owner: Compromise Checker defaults
    expires: never
  - id: base-php-fpm-opcache
    match: {check: process.injected, variant: shared, exe: "/usr/sbin/php-fpm*"}
    reason: >-
      PHP's opcache keeps its JIT code in shared memory, which /proc's maps
      show as "/dev/zero (deleted)". Only the shared-memory kind, only
      PHP-FPM as installed by the system: a memory-only file, a deleted
      file or a scratch file mapped into PHP-FPM still shows. Code a script
      maps the same way (PHP's FFI) looks the same and is let through too.
    owner: Compromise Checker defaults
    expires: never
  - id: base-efi-directory-mode
    match: {check: package.changed, package: efi-filesystem, path: /boot/efi}
    reason: >-
      AlmaLinux 10 mounts /boot/efi with wider permissions than its
      efi-filesystem package records (0755 against 0700).
    owner: Compromise Checker defaults
    expires: never
  - id: base-efi-tree-mode
    match: {check: package.changed, package: efi-filesystem, path: "/boot/efi/**"}
    reason: The same, for the directories under /boot/efi.
    owner: Compromise Checker defaults
    expires: never
