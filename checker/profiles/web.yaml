# Compromise Checker's web profile, for hosts whose web applications send
# their own mail (plan 2.10). Apply with `profiles: [base, web]`.
rules:
  - id: web-app-mail-www-data
    match: {check: mail.web_user, account: www-data}
    reason: >-
      The site's application sends mail (sign-ups, password resets) through
      the local sendmail as www-data. A burst of it, or mail to many new
      domains, still shows: mail.volume and mail.domains aren't covered.
    owner: Compromise Checker defaults
    expires: never
  - id: web-app-mail-apache
    match: {check: mail.web_user, account: apache}
    reason: The same, for RHEL's apache account (PHP-FPM's default user there).
    owner: Compromise Checker defaults
    expires: never
  - id: web-app-mail-nginx
    match: {check: mail.web_user, account: nginx}
    reason: The same, for applications run as nginx.
    owner: Compromise Checker defaults
    expires: never
