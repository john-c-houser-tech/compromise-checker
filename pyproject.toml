[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
# Internal package name only — the product name is undecided and appears in
# configuration and docs, never in code (DESIGN.md §19, decision 1).
name = "checker"
dynamic = ["version"]
description = "Agentless, read-only compromise checker for RHEL and Ubuntu servers"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.24.1",
    "Jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pyrage>=1.4.0",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.3", "ruff>=0.14", "anthropic>=2.3", "Django>=5.2.17,<6", "gunicorn>=23", "weasyprint>=70"]
# The web interface (Phase 5).
web = ["Django>=5.2.17,<6", "gunicorn>=23"]
# PDF reports (`checker report --format pdf`). Needs the Pango libraries too.
pdf = ["weasyprint>=70"]
# The screenshot script (tests/integration/screenshots.py), with a Chromium of your own.
shots = ["playwright>=1.50"]
# The optional AI advisor (policy §9).
advisor = ["anthropic>=2.3"]
# Passwords from the OS keyring instead of a prompt (--password-source keyring).
keyring = ["keyring>=25"]

[project.scripts]
checker = "checker.cli:main"

[tool.setuptools.dynamic]
version = { attr = "checker.__version__" }

[tool.setuptools.packages.find]
include = ["checker*"]

[tool.setuptools.package-data]
# The collector is shipped as a data file and streamed to targets as text;
# the controller never imports it (DESIGN.md §5.1).
checker = ["collector/collector.py", "templates/*.html.j2", "profiles/*.yaml"]
"checker.web" = ["templates/*.html.j2", "static/*.css", "static/fonts/*"]
# NouriLoop's key list, signed by the root key (plan 4.8).
"checker.packs" = ["keys/keys.yaml", "keys/keys.yaml.minisig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# The collector runs on the targets' own python3: 3.9 on RHEL 9 is the floor.
per-file-target-version = { "checker/collector/*.py" = "py39", "tests/collector/*.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"checker/web/finding_words.py" = ["E501"]  # sentences for people, kept whole so they can be read
"checker/checks/*.py" = ["S108"]  # /tmp and the like are places on the target, matched as data
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "S604"]  # asserts; addresses, made-up passwords, /tmp paths and shells as data; own commands
